version: '3.8'

# ==============================================================================
# TaskFlow SaaS — Production Container Orchestration
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. MongoDB Database with Multi-Document ACID Transaction Replica Set
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: taskflow_mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. Replica Set Initializer (Runs once to bootstrap MongoDB replica set rs0)
  # ----------------------------------------------------------------------------
  mongo-init:
    image: mongo:7.0
    container_name: taskflow_mongo_init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - taskflow-network
    entrypoint:
      - bash
      - -c
      - |
        echo "Initializing MongoDB replica set rs0..."
        mongosh --host mongo:27017 --eval '
          try {
            rs.status();
            console.log("Replica set rs0 already initialized.");
          } catch (e) {
            console.log("Initiating replica set rs0...");
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "mongo:27017" }]
            });
            console.log("Replica set rs0 successfully initiated.");
          }
        '

  # ----------------------------------------------------------------------------
  # 3. TaskFlow Backend API (Node.js / Express 5)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taskflow_api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://mongo:27017/taskflow?replicaSet=rs0&directConnection=true
      JWT_SECRET: ${JWT_SECRET:-supersecretproductiongradejwtsecret1234567890!}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET:-supersecretproductiongraderefreshsecret1234567890!}
      CSRF_SECRET: ${CSRF_SECRET:-supersecretproductiongradecsrfsecret1234567890!}
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:5173
      SHUTDOWN_TIMEOUT_MS: 10000
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 4. TaskFlow Web Client & Reverse Proxy (React / Vite / Nginx)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: taskflow_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  mongo_data:
    driver: local

networks:
  taskflow-network:
    driver: bridge
